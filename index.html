<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Untitled Space Game</title>
    <link rel="stylesheet" href="./src/platform/dom/colors.css">
    <style>
      @font-face {
        font-family: '256';
        src: url('./fonts/256.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { overflow: hidden; touch-action: none; }
      body {
        background: #000000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        height: 100dvh;
      }
      .game-screen {
        font-family: '256', monospace;
        font-size: 24px;
        line-height: 1em;
        white-space: pre;
        background: var(--color-black, #000);
        color: var(--color-white, #aaa);
        display: block;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
